button{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:11px 12px;cursor:pointer}
button.p{background:#fff;color:#000;font-weight:800;border-color:#fff}
button.d{color:var(--er)}.w{width:100%}
input,select{font:inherit;color:var(--tx);background:#000;border:1px solid var(--ln);border-radius:10px;padding:11px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0 12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.mdl{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;width:100%;max-width:520px;max-height:85vh;overflow-y:auto}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cd{border:1px solid var(--ln);border-radius:12px;padding:12px;background:var(--sf)}.cd b{display:block;font-size:20px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;border-bottom:1px solid var(--ln);text-align:left}.r{text-align:right}
h1{font-size:30px;font-weight:800;margin:20px 0 4px;line-height:1}h2{font-size:17px;margin:20px 0 8px}

L.forEach(function(l){var ok=l.status=="ok";
h+='<div class="row"><div><b'+(l.status=="iptal"?' style="text-decoration:line-through"':'')+'>'+l.qty+' × '+E(l.name)+'</b>'+(ok?(l.paid_qty?'<div class="mu sm">'+l.paid_qty+' adet ödendi</div>':''):' <span class="'+(l.status=="iptal"?'er':'wa')+' sm">'+(l.status=="iptal"?"İPTAL":"İKRAM")+'</span><div class="mu sm">'+E(l.reason)+'</div>')+'</div><div style="display:flex;gap:6px;align-items:center"><span>'+F(ok?l.price*l.qty:0)+'</span>';

h+='</div></div>'});
if(L.length){if(d.length)h+='<p class="mu sm" style="margin-top:12px">Ödemeye geçmek için önce onay bekleyen ürünleri onaylayın ya da temizleyin.</p>';
else h+='<button class="p w" data-a="cl" style="margin-top:16px">Ödeme / hesabı kapat · kalan '+F(due(o))+'</button>'}

RP.i.forEach(function(l){IM[l.id]=l;
